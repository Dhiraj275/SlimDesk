
services:
  mysql:
    image: mysql:8.0
    container_name: slimdesk-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: slimdesk
      MYSQL_USER: slimdesk
      MYSQL_PASSWORD: slimdesk_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    driver: local
